name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target MonitorUtility_VST3 --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "No .vst3 bundle was produced." }
          Compress-Archive -Path $plugin.FullName -DestinationPath "$PWD\MonitorUtility-Windows-x64-VST3.zip" -Force

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorUtility-Windows-x64-VST3
          path: MonitorUtility-Windows-x64-VST3.zip
          if-no-files-found: error
          retention-days: 30
